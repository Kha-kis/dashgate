groups:
  - name: dashgate-backup
    interval: 1m
    rules:
      - alert: DashGateBackupFailed
        expr: dashgate_backup_last_attempt_success{job="node"} == 0 or dashgate_backup_service_failure{job="node"} == 1
        for: 5m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: DashGate backup failed
          description: Inspect journalctl -u dashgate-backup.service on media.
      - alert: DashGateBackupStale
        expr: time() - dashgate_backup_last_success_timestamp_seconds{job="node"} > 36 * 60 * 60
        for: 5m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: DashGate backup is overdue
          description: No verified DashGate backup has succeeded in 36 hours on media.
      - alert: DashGateBackupMetricsMissing
        expr: absent(dashgate_backup_last_attempt_success{job="node"})
        for: 15m
        labels:
          severity: warning
          service: backup
        annotations:
          summary: DashGate backup metrics are missing
          description: Check the scheduled backup service and node-exporter textfile on media.
